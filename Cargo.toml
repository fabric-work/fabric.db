[workspace]
members = [
  "crates/fabric-core",
  "crates/fabric-control-plane",
  "crates/fabric-runtime"
]

# Vendor-specific adapter: built on its own, not part of the core workspace.
exclude = ["crates/anydb-adapter-surrealdb"]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"